<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Training Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg: #14181f;
  --panel: #1c222c;
  --panel-2: #232a36;
  --line: #313a48;
  --ink: #e8ebf0;
  --ink-dim: #8b95a5;
  --accent: #d4a017;
  --accent-dim: #8a6c1f;
  --good: #5fae6f;
  --danger: #c76b5f;
  --radius: 10px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}

header{margin-bottom:22px;}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px;
}
h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;letter-spacing:.01em;
  font-size:32px;margin:0 0 4px;
  text-transform:uppercase;
}
.sub{color:var(--ink-dim);font-size:14px;margin:0;}

.streak{display:flex;gap:6px;margin-top:16px;}
.tick{flex:1;height:8px;border-radius:2px;background:var(--panel-2);border:1px solid var(--line);}
.tick.filled{background:var(--accent);border-color:var(--accent);}
.streak-label{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);
  margin-top:6px;display:flex;justify-content:space-between;
}

.day-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0;}
.day-btn{
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--radius);padding:12px 8px;cursor:pointer;text-align:center;
  font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.03em;text-transform:uppercase;
  transition:.15s;
}
.day-btn:hover{border-color:var(--accent-dim);}
.day-btn.active{background:var(--accent);border-color:var(--accent);color:#1a1408;font-weight:600;}
.day-btn .tag{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:none;letter-spacing:0;opacity:.7;margin-top:2px;}

.tabs{display:flex;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--line);}
.tab{
  font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em;
  color:var(--ink-dim);background:none;border:none;padding:10px 4px;cursor:pointer;
  border-bottom:2px solid transparent;text-transform:uppercase;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.session-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.session-head h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:20px;margin:0;}
.session-head span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);}

.ex-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;
}
.ex-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;justify-content:space-between;}
.ex-top-main{display:flex;gap:10px;align-items:flex-start;flex:1;}
.ex-num{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:13px;min-width:22px;}
.ex-name{font-weight:600;font-size:15px;line-height:1.3;}
.ex-target{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);margin-top:2px;}
.ex-note{font-size:12px;color:var(--ink-dim);margin-top:4px;font-style:italic;}
.info-btn{
  background:var(--panel-2);border:1px solid var(--line);color:var(--accent);
  border-radius:6px;padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:11px;
  cursor:pointer;white-space:nowrap;
}
.info-panel{
  display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-dim);line-height:1.6;
}
.info-panel img{width:100%;max-width:260px;border-radius:8px;margin-bottom:8px;display:block;}
.wger-meta b{color:var(--ink);}
.wger-attr{margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10px;}
.wger-attr a{color:var(--accent);}

.sets-table{margin-top:10px;}
.set-row{display:grid;grid-template-columns:50px 1fr 1fr;gap:8px;margin-bottom:6px;align-items:center;}
.set-row .set-lbl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);}
.set-field{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 8px;}
.set-field label{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-dim);text-transform:uppercase;margin-bottom:3px;letter-spacing:.05em;}
.set-field input{width:100%;background:none;border:none;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:15px;outline:none;}
.set-field input::placeholder{color:#4a5568;}

.cardio-card{
  background:var(--panel);border:1px dashed var(--accent-dim);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;
}
.cardio-card .lbl{font-weight:600;font-size:14px;}
.cardio-card .sm{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);}
.cardio-card input{width:60px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-family:'JetBrains Mono',monospace;padding:8px;text-align:center;}

textarea{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink);padding:12px;font-family:'Inter',sans-serif;font-size:13px;resize:vertical;
  min-height:50px;margin-bottom:14px;
}

.save-btn{
  width:100%;background:var(--accent);color:#1a1408;border:none;border-radius:var(--radius);
  padding:14px;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.03em;
  text-transform:uppercase;font-weight:600;cursor:pointer;
}
.save-btn:disabled{opacity:.5;cursor:default;}
.save-msg{text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--good);margin-top:8px;min-height:16px;}
.autosave-note{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-dim);margin-top:-6px;margin-bottom:10px;}

.hist-entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.hist-top{display:flex;justify-content:space-between;align-items:baseline;}
.hist-day{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:15px;}
.hist-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);}
.hist-body{margin-top:8px;font-size:13px;color:var(--ink-dim);line-height:1.6;}
.hist-body b{color:var(--ink);}
.empty{text-align:center;padding:40px 20px;color:var(--ink-dim);font-size:13px;border:1px dashed var(--line);border-radius:var(--radius);}
.loading{text-align:center;color:var(--ink-dim);font-size:13px;padding:20px;}

.targets-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.targets-title{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.targets-row{display:flex;gap:10px;flex-wrap:wrap;}
.target-pill{flex:1;min-width:80px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
.target-pill .num{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--accent);font-weight:700;}
.target-pill .lbl{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

.nutri-form{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.nutri-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.nutri-field{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px;}
.nutri-field label{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-dim);text-transform:uppercase;margin-bottom:4px;letter-spacing:.05em;}
.nutri-field input{width:100%;background:none;border:none;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:14px;outline:none;}

.nutri-log-entry{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:13px;}
.nutri-log-entry .d{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);font-size:11px;}
.nutri-log-entry .v{font-family:'JetBrains Mono',monospace;}

/* progress / charts */
.chart-select{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  color:var(--ink);padding:12px;font-family:'JetBrains Mono',monospace;font-size:13px;margin-bottom:14px;
}
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.chart-title{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:15px;margin-bottom:4px;}
.chart-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);margin-bottom:12px;}
.chart-svg-wrap{width:100%;overflow-x:auto;}
.chart-svg-wrap svg{display:block;}
.chart-pt{fill:var(--accent);}
.chart-line{fill:none;stroke:var(--accent);stroke-width:2;}
.chart-axis{stroke:var(--line);stroke-width:1;}
.chart-label{font-family:'JetBrains Mono',monospace;font-size:9px;fill:var(--ink-dim);}
.chart-empty{text-align:center;color:var(--ink-dim);font-size:12px;padding:30px 0;}

/* PR badge */
.pr-banner{
  background:linear-gradient(90deg, var(--accent-dim), var(--accent));
  color:#1a1408;border-radius:8px;padding:10px 14px;margin-top:10px;
  font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.03em;font-weight:600;
}

/* history edit/delete */
.hist-actions{display:flex;gap:8px;margin-top:10px;}
.hist-btn{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:6px;padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;
}
.hist-btn.edit{color:var(--accent);}
.hist-btn.danger{color:var(--danger);}
.hist-edit-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0;}
.hist-edit-row input{
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);
  font-family:'JetBrains Mono',monospace;font-size:13px;padding:6px;width:100%;
}
.export-btn{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;
  margin-bottom:14px;width:100%;text-align:center;
}

/* rest timer */
.timer-card{background:var(--panel);border:1px solid var(--accent-dim);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.timer-title{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:14px;margin-bottom:10px;}
.timer-display{
  font-family:'JetBrains Mono',monospace;font-size:36px;text-align:center;color:var(--accent);
  margin-bottom:10px;font-weight:700;
}
.timer-presets{display:flex;gap:8px;margin-bottom:10px;}
.timer-preset{
  flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  border-radius:6px;padding:8px;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;
}
.timer-preset.active{background:var(--accent);color:#1a1408;border-color:var(--accent);}
.timer-controls{display:flex;gap:8px;}
.timer-controls button{
  flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  border-radius:6px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;text-transform:uppercase;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Fitness Connection &middot; 6-Day Push / Pull / Legs</div>
    <h1>Training Log</h1>
    <p class="sub">Knee-modified &middot; beginner progression &middot; 45&ndash;60 min sessions</p>
    <div class="streak" id="streak"></div>
    <div class="streak-label"><span id="streakText">Loading...</span><span id="totalText"></span></div>
  </header>

  <div class="day-grid" id="dayGrid"></div>

  <div class="tabs">
    <button class="tab active" data-tab="log">Log Session</button>
    <button class="tab" data-tab="nutrition">Nutrition</button>
    <button class="tab" data-tab="progress">Progress</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <div id="logView"></div>
  <div id="nutritionView" style="display:none;"></div>
  <div id="progressView" style="display:none;"></div>
  <div id="historyView" style="display:none;"></div>
</div>

<script>
// When running standalone (e.g. GitHub Pages), route storage through Supabase
// instead of Claude's built-in window.storage, so data syncs across devices.
const SUPABASE_URL = "https://ikzuupmmfijewobbgxaf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NwoBTbmwhlOLWd6_uIoUKQ_M_SPLdCo";

async function sbRequest(path, options={}){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: options.method || "GET",
    headers: Object.assign({
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    }, options.headers || {}),
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  if(!res.ok){
    const t = await res.text().catch(()=>"");
    throw new Error("Supabase " + res.status + ": " + t);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

if(!window.storage){
  window.storage = {
    async get(key){
      if(key.startsWith("entry:")){
        const [, date, dayKey] = key.split(":");
        const rows = await sbRequest("workout_entries?entry_date=eq."+date+"&day_key=eq."+dayKey+"&select=*");
        if(!rows || rows.length===0) throw new Error("not found");
        const r = rows[0];
        const value = JSON.stringify({
          day: r.day_key, label: r.day_label, date: r.entry_date,
          lastSaved: r.last_saved, exercises: r.exercises,
          cardioMin: r.cardio_min, notes: r.notes, hasData: true
        });
        return { key, value, shared:false };
      }
      if(key.startsWith("nutrition:")){
        const date = key.split(":")[1];
        const rows = await sbRequest("nutrition_entries?entry_date=eq."+date+"&select=*");
        if(!rows || rows.length===0) throw new Error("not found");
        const r = rows[0];
        const value = JSON.stringify({
          date: r.entry_date, weight: r.weight, calories: r.calories,
          protein: r.protein, notes: r.notes, timestamp: r.last_saved
        });
        return { key, value, shared:false };
      }
      const v = localStorage.getItem(key);
      if(v===null) throw new Error("not found");
      return { key, value: v, shared:false };
    },
    async set(key, value){
      if(key.startsWith("entry:")){
        const [, date, dayKey] = key.split(":");
        const e = JSON.parse(value);
        await sbRequest("workout_entries?on_conflict=entry_date,day_key", {
          method:"POST",
          headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
          body: { entry_date: date, day_key: dayKey, day_label: e.label,
                   exercises: e.exercises, cardio_min: e.cardioMin ? Number(e.cardioMin) : null,
                   notes: e.notes, last_saved: e.lastSaved || new Date().toISOString() }
        });
        return { key, value, shared:false };
      }
      if(key.startsWith("nutrition:")){
        const date = key.split(":")[1];
        const e = JSON.parse(value);
        await sbRequest("nutrition_entries?on_conflict=entry_date", {
          method:"POST",
          headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
          body: { entry_date: date, weight: e.weight ? Number(e.weight) : null,
                   calories: e.calories ? Number(e.calories) : null, protein: e.protein ? Number(e.protein) : null,
                   notes: e.notes, last_saved: e.timestamp || new Date().toISOString() }
        });
        return { key, value, shared:false };
      }
      localStorage.setItem(key, value);
      return { key, value, shared:false };
    },
    async delete(key){
      if(key.startsWith("entry:")){
        const [, date, dayKey] = key.split(":");
        await sbRequest("workout_entries?entry_date=eq."+date+"&day_key=eq."+dayKey, { method:"DELETE" });
        return { key, deleted:true, shared:false };
      }
      if(key.startsWith("nutrition:")){
        const date = key.split(":")[1];
        await sbRequest("nutrition_entries?entry_date=eq."+date, { method:"DELETE" });
        return { key, deleted:true, shared:false };
      }
      localStorage.removeItem(key);
      return { key, deleted:true, shared:false };
    },
    async list(prefix){
      if(prefix === "entry:"){
        const rows = await sbRequest("workout_entries?select=entry_date,day_key&order=entry_date.desc");
        return { keys: rows.map(r=>"entry:"+r.entry_date+":"+r.day_key), prefix, shared:false };
      }
      if(prefix === "nutrition:"){
        const rows = await sbRequest("nutrition_entries?select=entry_date&order=entry_date.desc");
        return { keys: rows.map(r=>"nutrition:"+r.entry_date), prefix, shared:false };
      }
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared:false };
    }
  };
}

const PROGRAM = {
  push1: { label: "Push A", tag: "Chest/Shldr/Tri", exercises: [
    { name: "Machine Chest Press", target: "3 x 10–12", note: "Controlled tempo, full range." },
    { name: "Seated Shoulder Press", target: "3 x 10–12" },
    { name: "Cable Lateral Raise", target: "3 x 12–15" },
    { name: "Triceps Pushdown", target: "3 x 12–15" },
    { name: "Assisted Dip", target: "2 x max reps" },
  ]},
  pull1: { label: "Pull A", tag: "Back/Biceps", exercises: [
    { name: "Lat Pulldown", target: "3 x 10–12" },
    { name: "Seated Cable Row", target: "3 x 10–12" },
    { name: "Face Pull", target: "3 x 12–15" },
    { name: "Dumbbell Bicep Curl", target: "3 x 12–15" },
    { name: "Back Extension", target: "2 x 12", note: "Light — control the movement." },
  ]},
  legs1: { label: "Legs A", tag: "Knee-friendly", exercises: [
    { name: "Leg Press", target: "3 x 10–12", note: "Moderate depth — stop short of knee pain." },
    { name: "Romanian Deadlift", target: "3 x 10–12", note: "Hip hinge, soft knees — not a squat." },
    { name: "Seated Leg Curl", target: "3 x 12" },
    { name: "Standing Calf Raise", target: "3 x 15" },
    { name: "Glute Bridge", target: "3 x 12–15" },
    { name: "Plank", target: "3 x 30–45s" },
  ]},
  push2: { label: "Push B", tag: "Chest/Shldr/Tri", exercises: [
    { name: "Incline Machine Press", target: "3 x 10–12" },
    { name: "Dumbbell Shoulder Press", target: "3 x 10–12" },
    { name: "Cable Front Raise", target: "3 x 12–15" },
    { name: "Overhead Triceps Extension", target: "3 x 12–15" },
    { name: "Chest Fly", target: "2 x 12–15" },
  ]},
  pull2: { label: "Pull B", tag: "Back/Biceps", exercises: [
    { name: "Chest Supported Row", target: "3 x 10–12" },
    { name: "Single Arm Lat Pulldown", target: "3 x 10–12" },
    { name: "Rear Delt Fly", target: "3 x 12–15" },
    { name: "Hammer Curl", target: "3 x 12–15" },
    { name: "Wide Grip Cable Row", target: "2 x 12" },
  ]},
  legs2: { label: "Legs B", tag: "Knee-friendly", exercises: [
    { name: "Leg Press Wide Stance", target: "3 x 10–12", note: "Shallow, controlled — sub for squats." },
    { name: "Step Up", target: "3 x 10/leg", note: "Low box — control the descent." },
    { name: "Leg Extension", target: "3 x 12", note: "Light-moderate. Skip if it aggravates the knee." },
    { name: "Hip Abduction Machine", target: "3 x 15" },
    { name: "Seated Calf Raise", target: "3 x 15" },
    { name: "Side Plank", target: "3 x 20–30s/side" },
  ]},
  rest: { label: "Rest", tag: "Recovery day", exercises: [] },
};
const DAY_ORDER = ["push1","pull1","legs1","push2","pull2","legs2","rest"];
const TARGETS = { calories: 1950, protein: 150, fat: 60, carbs: 200 };

let selectedDay = "push1";
let activeTab = "log";

function todayISO(){ return new Date().toISOString().slice(0,10); }

// ---------- Day picker ----------
function renderDayGrid(){
  const grid = document.getElementById("dayGrid");
  grid.innerHTML = "";
  DAY_ORDER.forEach(key=>{
    const d = PROGRAM[key];
    const btn = document.createElement("button");
    btn.className = "day-btn" + (key===selectedDay ? " active":"");
    btn.innerHTML = d.label + '<span class="tag">'+d.tag+'</span>';
    btn.onclick = ()=>{ selectedDay = key; renderDayGrid(); renderLog(); };
    grid.appendChild(btn);
  });
}

// ---------- Tabs ----------
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{

// ---------- Log view ----------
async function renderLog(){
  const view = document.getElementById("logView");
  const day = PROGRAM[selectedDay];

  if(selectedDay === "rest"){
    view.innerHTML = '<div class="empty">Rest day. No lifting logged here — light walking or stretching if you feel like it.</div>';
    return;
  }

  // try to load an existing entry for today+this day
  let existing = null;
  try{
    const r = await window.storage.get(entryKey(), false);
    if(r && r.value) existing = JSON.parse(r.value);
  }catch(e){ /* no existing entry yet */ }

  let html = '<div class="session-head"><h2>'+day.label+'</h2><span>'+todayISO()+'</span></div>';

  day.exercises.forEach((ex, i)=>{
    const savedEx = existing && existing.exercises && existing.exercises[i];
    html += '<div class="ex-card" data-ex="'+i+'">';
    html += '<div class="ex-top"><div class="ex-top-main"><div class="ex-num">'+String(i+1).padStart(2,"0")+'</div><div>';
    html += '<div class="ex-name">'+ex.name+'</div>';
    html += '<div class="ex-target">Target: '+ex.target+'</div>';
    if(ex.note) html += '<div class="ex-note">'+ex.note+'</div>';
    html += '</div></div>';
    html += '<button class="info-btn" type="button" data-info-idx="'+i+'" data-info-name="'+ex.name.replace(/"/g,"&quot;")+'">Form?</button>';
    html += '</div>';
    html += '<div class="info-panel" id="info-'+i+'"></div>';
    html += '<div class="sets-table">';
    for(let s=1; s<=3; s++){
      const sv = savedEx && savedEx.sets && savedEx.sets[s-1];
      html += '<div class="set-row"><div class="set-lbl">Set '+s+'</div>';
      html += '<div class="set-field"><label>Weight (lb)</label><input type="number" inputmode="decimal" placeholder="—" data-set="'+s+'" data-field="weight" value="'+(sv&&sv.weight!=null?sv.weight:"")+'"></div>';
      html += '<div class="set-field"><label>Reps</label><input type="number" inputmode="numeric" placeholder="—" data-set="'+s+'" data-field="reps" value="'+(sv&&sv.reps!=null?sv.reps:"")+'"></div>';
      html += '</div>';
    }
    html += '</div></div>';
  });

  html += '<div class="cardio-card"><div><div class="lbl">Cardio finisher</div><div class="sm">incline walk / bike, low impact</div></div>';
  html += '<input type="number" id="cardioMin" placeholder="min" value="'+(existing&&existing.cardioMin?existing.cardioMin:"")+'"></div>';

  html += '<div class="timer-card"><div class="timer-title">Rest Timer</div>';
  html += '<div class="timer-display" id="timerDisplay">1:30</div>';
  html += '<div class="timer-presets">';
  html += '<button class="timer-preset" data-secs="60">60s</button>';
  html += '<button class="timer-preset active" data-secs="90">90s</button>';
  html += '<button class="timer-preset" data-secs="120">120s</button>';
  html += '</div>';
  html += '<div class="timer-controls"><button id="timerStart">Start</button><button id="timerReset">Reset</button></div>';
  html += '</div>';

  html += '<textarea id="notes" placeholder="Notes — how it felt, knee check-in, energy...">'+(existing&&existing.notes?existing.notes:"")+'</textarea>';
  html += '<button class="save-btn" id="saveBtn">Save Workout</button>';
  html += '<div class="autosave-note">Fields autosave as you fill them in — Save just confirms, updates your streak, and checks for PRs.</div>';
  html += '<div class="save-msg" id="saveMsg">'+(existing ? "Loaded your entry for today." : "")+'</div>';
  html += '<div id="prBanner"></div>';

  view.innerHTML = html;
  document.getElementById("saveBtn").onclick = ()=>saveEntry(true);
  initRestTimer();

  // autosave on blur (delegated, capture phase since blur doesn't bubble)
  view.addEventListener("blur", (e)=>{
    if(e.target.matches && e.target.matches("input,textarea")){
      saveEntry(false);
    }
  }, true);

  // "Form?" buttons (delegated, avoids fragile inline onclick + quoting issues)
  view.addEventListener("click", (e)=>{
    const btn = e.target.closest(".info-btn");
    if(btn){
      toggleInfo(parseInt(btn.dataset.infoIdx), btn.dataset.infoName);
    }
  });
}

function entryKey(){
  return "entry:" + todayISO() + ":" + selectedDay;
}

// ---------- Rest timer ----------
let timerInterval = null;
let timerSecsLeft = 90;
let timerTotal = 90;

function initRestTimer(){
  timerSecsLeft = 90; timerTotal = 90;
  clearInterval(timerInterval); timerInterval = null;
  const display = document.getElementById("timerDisplay");
  if(!display) return;
  updateTimerDisplay();

  document.querySelectorAll(".timer-preset").forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(".timer-preset").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      timerTotal = parseInt(btn.dataset.secs);
      timerSecsLeft = timerTotal;
      clearInterval(timerInterval); timerInterval = null;
      document.getElementById("timerStart").textContent = "Start";
      updateTimerDisplay();
    };
  });

  document.getElementById("timerStart").onclick = ()=>{
    const btn = document.getElementById("timerStart");
    if(timerInterval){
      clearInterval(timerInterval); timerInterval = null;
      btn.textContent = "Resume";
      return;
    }
    btn.textContent = "Pause";
    timerInterval = setInterval(()=>{
      timerSecsLeft--;
      updateTimerDisplay();
      if(timerSecsLeft<=0){
        clearInterval(timerInterval); timerInterval = null;
        if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
        btn.textContent = "Start";
        timerSecsLeft = timerTotal;
        updateTimerDisplay();
      }
    }, 1000);
  };

  document.getElementById("timerReset").onclick = ()=>{
    clearInterval(timerInterval); timerInterval = null;
    timerSecsLeft = timerTotal;
    document.getElementById("timerStart").textContent = "Start";
    updateTimerDisplay();
  };
}

function updateTimerDisplay(){
  const display = document.getElementById("timerDisplay");
  if(!display) return;
  const m = Math.floor(timerSecsLeft/60);
  const s = timerSecsLeft%60;
  display.textContent = m + ":" + String(s).padStart(2,"0");
}

function collectEntry(){
  const day = PROGRAM[selectedDay];
  const exercises = [];
  let hasData = false;
  document.querySelectorAll(".ex-card").forEach(card=>{
    const idx = parseInt(card.dataset.ex);
    const sets = [];
    for(let s=1; s<=3; s++){
      const w = card.querySelector('input[data-set="'+s+'"][data-field="weight"]');
      const r = card.querySelector('input[data-set="'+s+'"][data-field="reps"]');
      const weight = w && w.value !== "" ? Number(w.value) : null;
      const reps = r && r.value !== "" ? Number(r.value) : null;
      if(weight!==null || reps!==null) hasData = true;
      sets.push({ weight, reps });
    }
    exercises.push({ name: day.exercises[idx].name, sets });
  });
  const cardioEl = document.getElementById("cardioMin");
  const notesEl = document.getElementById("notes");
  const cardioMin = cardioEl && cardioEl.value ? cardioEl.value : null;
  const notes = notesEl && notesEl.value ? notesEl.value : "";
  if(cardioMin) hasData = true;
  if(notes) hasData = true;

  return {
    day: selectedDay,
    label: day.label,
    date: todayISO(),
    lastSaved: new Date().toISOString(),
    exercises,
    cardioMin,
    notes,
    hasData
  };
}

async function saveEntry(explicit){
  const btn = document.getElementById("saveBtn");
  const msg = document.getElementById("saveMsg");
  const prBanner = document.getElementById("prBanner");
  const entry = collectEntry();

  if(!entry.hasData){
    if(explicit && msg){ msg.textContent = "Nothing to save yet."; msg.style.color = "var(--ink-dim)"; }
    return;
  }

  if(explicit && btn) btn.disabled = true;
  try{
    // compute PRs before saving (compare against history, excluding today's own prior save)
    let prLines = [];
    if(explicit){
      try{
        const maxes = await computeExerciseMaxes(entryKey());
        entry.exercises.forEach(ex=>{
          const bestToday = Math.max(0, ...ex.sets.filter(s=>s.weight!=null).map(s=>s.weight));
          if(bestToday>0){
            const prev = maxes[ex.name];
            if(!prev || bestToday > prev.weight){
              prLines.push(ex.name + " — " + bestToday + " lb" + (prev ? " (was " + prev.weight + " lb)" : " (first time logged)"));
            }
          }
        });
      }catch(e){ /* PR check is best-effort, don't block saving */ }
    }

    const res = await window.storage.set(entryKey(), JSON.stringify(entry), false);
    if(explicit){
      if(res){
        msg.textContent = "Saved — nice work.";
        msg.style.color = "var(--good)";
        await loadStreak();
        if(prBanner){
          prBanner.innerHTML = prLines.length
            ? prLines.map(l=>'<div class="pr-banner">\u{1F3C6} New PR — '+l+'</div>').join("")
            : "";
        }
      } else {
        msg.textContent = "Couldn't save — try again.";
        msg.style.color = "var(--danger)";
      }
    }
  } catch(e){
    if(explicit && msg){ msg.textContent = "Storage error — your data wasn't saved."; msg.style.color = "var(--danger)"; }
  }
  if(explicit && btn) btn.disabled = false;
}

// scans all past workout entries to find each exercise's best-ever weight
async function computeExerciseMaxes(excludeKey){
  const maxes = {};
  const list = await window.storage.list("entry:", false);
  if(list && list.keys){
    for(const k of list.keys){
      if(k === excludeKey) continue;
      try{
        const r = await window.storage.get(k, false);
        const e = JSON.parse(r.value);
        (e.exercises||[]).forEach(ex=>{
          (ex.sets||[]).forEach(s=>{
            if(s.weight!=null){
              if(!maxes[ex.name] || s.weight > maxes[ex.name].weight){
                maxes[ex.name] = { weight: s.weight, date: e.date };
              }
            }
          });
        });
      }catch(err){}
    }
  }
  return maxes;
}

// ---------- Exercise info (Free Exercise DB — public domain, static, no API guesswork) ----------
const EXDB_URL = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json";
const EXDB_IMG_BASE = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises/";
const EXDB_CACHE_KEY = "exercisedb_cache_v1";
let exerciseDbCache = null;

async function loadExerciseDb(){
  if(exerciseDbCache) return exerciseDbCache;
  try{
    const cached = localStorage.getItem(EXDB_CACHE_KEY);
    if(cached){ exerciseDbCache = JSON.parse(cached); return exerciseDbCache; }
  }catch(e){}
  const res = await fetch(EXDB_URL);
  if(!res.ok) throw new Error("could not load exercise database");
  const data = await res.json();
  exerciseDbCache = data;
  try{ localStorage.setItem(EXDB_CACHE_KEY, JSON.stringify(data)); }catch(e){ /* quota — fine, just won't cache */ }
  return data;
}

const EXDB_STOPWORDS = new Set(["machine","assisted","seated","standing","wide","stance","single","arm","the","a","an"]);
const EXDB_MATCH_THRESHOLD = 0.34;

function exdbTokenize(name){
  return name.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
}

function exdbTokensMatch(a,b){
  if(a===b) return true;
  if(a.length>=3 && b.length>=3 && (a.startsWith(b)||b.startsWith(a))) return true;
  if(a.length>=5 && b.length>=5 && a.slice(0,5)===b.slice(0,5)) return true;
  return false;
}

function exdbFindBestMatch(db, name){
  const fullTokens = exdbTokenize(name);
  const coreTokens = fullTokens.filter(t=>!EXDB_STOPWORDS.has(t));
  const tryTokens = coreTokens.length ? coreTokens : fullTokens;
  let best = null, bestRatio = 0, bestMatches = 0;
  db.forEach(ex=>{
    const candTokens = exdbTokenize(ex.name);
    const candSet = new Set(candTokens);
    let matches = 0;
    const matchedCand = new Set();
    tryTokens.forEach(t=>{
      for(const c of candSet){
        if(!matchedCand.has(c) && exdbTokensMatch(t,c)){ matches++; matchedCand.add(c); break; }
      }
    });
    if(matches===0) return;
    const union = new Set([...tryTokens, ...candTokens]).size;
    const ratio = matches/union;
    if(ratio > bestRatio || (ratio===bestRatio && matches > bestMatches)){
      bestRatio = ratio; best = ex; bestMatches = matches;
    }
  });
  return (bestRatio >= EXDB_MATCH_THRESHOLD) ? best : null;
}

async function toggleInfo(idx, name){
  const panel = document.getElementById("info-"+idx);
  if(panel.style.display === "block"){ panel.style.display = "none"; return; }
  panel.style.display = "block";
  if(panel.dataset.loaded === "1") return;
  panel.innerHTML = '<div class="loading">Loading...</div>';

  const cacheKey = "exinfo:" + name.toLowerCase();
  try{
    let data = null;
    try{
      const cached = await window.storage.get(cacheKey, false);
      if(cached && cached.value) data = JSON.parse(cached.value);
    }catch(e){ /* not cached */ }

    if(!data){
      const db = await loadExerciseDb();
      const match = exdbFindBestMatch(db, name);
      if(!match) throw new Error("no match");
      const imgPath = match.images && match.images[0];
      data = {
        img: imgPath ? EXDB_IMG_BASE + imgPath : null,
        matchedName: match.name,
        primaryMuscles: (match.primaryMuscles||[]).join(", "),
        secondaryMuscles: (match.secondaryMuscles||[]).join(", "),
        equipment: match.equipment || "",
        instructions: match.instructions || []
      };
      try{ await window.storage.set(cacheKey, JSON.stringify(data), false); }catch(e){}
    }

    let html = "";
    if(data.img) html += '<img src="'+data.img+'" alt="'+name+'" loading="lazy">';
    if(data.matchedName && data.matchedName.toLowerCase() !== name.toLowerCase()){
      html += '<div class="wger-meta" style="font-style:italic;">Closest match: '+data.matchedName+'</div>';
    }
    if(data.primaryMuscles) html += '<div class="wger-meta"><b>Primary muscles:</b> '+data.primaryMuscles+'</div>';
    if(data.secondaryMuscles) html += '<div class="wger-meta"><b>Secondary:</b> '+data.secondaryMuscles+'</div>';
    if(data.equipment) html += '<div class="wger-meta"><b>Equipment:</b> '+data.equipment+'</div>';
    if(data.instructions && data.instructions.length){
      html += '<div class="wger-meta" style="margin-top:6px;"><b>How to:</b>';
      html += '<ol style="margin:4px 0 0 18px;padding:0;">';
      data.instructions.slice(0,6).forEach(step=>{ html += '<li style="margin-bottom:4px;">'+step+'</li>'; });
      html += '</ol></div>';
    }
    html += '<div class="wger-attr">Source: Free Exercise DB (public domain)</div>';
    panel.innerHTML = html;
    panel.dataset.loaded = "1";
  }catch(e){
    panel.innerHTML = '<div class="wger-meta">Couldn\'t find a good match for "'+name+'" in the exercise database. <a href="https://yuhonas.github.io/free-exercise-db/" target="_blank" rel="noopener">Search it directly here.</a></div>';
    panel.dataset.loaded = "1";
  }
}

// ---------- History ----------
async function renderHistory(){
  const view = document.getElementById("historyView");
  view.innerHTML = '<div class="loading">Loading history...</div>';
  try{
    const list = await window.storage.list("entry:", false);
    if(!list || !list.keys || list.keys.length===0){
      view.innerHTML = '<div class="empty">No sessions logged yet. Finish a workout and hit Save.</div>';
      return;
    }
    const keys = [...list.keys].sort().reverse().slice(0,25);
    const entries = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, false);
        if(r && r.value){
          const e = JSON.parse(r.value);
          if(e.hasData !== false) entries.push({ key: k, data: e });
        }
      }catch(e){}
    }
    if(entries.length===0){
      view.innerHTML = '<div class="empty">No sessions logged yet.</div>';
      return;
    }
    let html = '<button class="export-btn" id="exportBtn">Export all my data (JSON)</button>';
    entries.forEach(({key, data:e}, idx)=>{
      html += '<div class="hist-entry" data-hist-key="'+key+'"><div class="hist-top">';
      html += '<div class="hist-day">'+e.label+'</div><div class="hist-date">'+e.date+'</div></div>';
      html += '<div class="hist-body" data-hist-view="'+idx+'">';
      (e.exercises||[]).forEach(ex=>{
        const parts = (ex.sets||[]).filter(s=>s.weight!=null || s.reps!=null)
          .map(s=> (s.weight!=null?s.weight+'lb':'BW') + ' x ' + (s.reps!=null?s.reps:'?') );
        if(parts.length) html += '<div><b>'+ex.name+':</b> '+parts.join(", ")+'</div>';
      });
      if(e.cardioMin) html += '<div><b>Cardio:</b> '+e.cardioMin+' min</div>';
      if(e.notes) html += '<div style="margin-top:4px;">"'+e.notes+'"</div>';
      html += '</div>';
      html += '<div class="hist-edit" data-hist-edit="'+idx+'" style="display:none;"></div>';
      html += '<div class="hist-actions">';
      html += '<button class="hist-btn edit" data-act="edit" data-idx="'+idx+'">Edit</button>';
      html += '<button class="hist-btn danger" data-act="delete" data-idx="'+idx+'">Delete</button>';
      html += '</div></div>';
    });
    view.innerHTML = html;

    document.getElementById("exportBtn").onclick = exportAllData;

    view.querySelectorAll('[data-act="delete"]').forEach(btn=>{
      btn.onclick = async ()=>{
        const idx = parseInt(btn.dataset.idx);
        const {key, data} = entries[idx];
        if(!confirm('Delete '+data.label+' on '+data.date+'? This can\'t be undone.')) return;
        try{
          await window.storage.delete(key, false);
          await loadStreak();
          renderHistory();
        }catch(e){ alert('Could not delete — try again.'); }
      };
    });

    view.querySelectorAll('[data-act="edit"]').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = parseInt(btn.dataset.idx);
        const editEl = view.querySelector('[data-hist-edit="'+idx+'"]');
        const viewEl = view.querySelector('[data-hist-view="'+idx+'"]');
        if(editEl.style.display === "none"){
          renderHistEditForm(editEl, entries[idx], idx);
          editEl.style.display = "";
          viewEl.style.display = "none";
          btn.textContent = "Cancel";
        } else {
          editEl.style.display = "none";
          viewEl.style.display = "";
          btn.textContent = "Edit";
        }
      };
    });
  }catch(e){
    view.innerHTML = '<div class="empty">Couldn\'t load history right now.</div>';
  }
}

function renderHistEditForm(container, entryWrap, idx){
  const e = entryWrap.data;
  let html = "";
  e.exercises.forEach((ex, exi)=>{
    html += '<div style="margin:10px 0;"><div class="ex-name" style="font-size:13px;">'+ex.name+'</div>';
    (ex.sets||[]).forEach((s, si)=>{
      html += '<div class="hist-edit-row">';
      html += '<input type="number" placeholder="Weight" data-ex="'+exi+'" data-set="'+si+'" data-field="weight" value="'+(s.weight!=null?s.weight:"")+'">';
      html += '<input type="number" placeholder="Reps" data-ex="'+exi+'" data-set="'+si+'" data-field="reps" value="'+(s.reps!=null?s.reps:"")+'">';
      html += '</div>';
    });
    html += '</div>';
  });
  html += '<div class="hist-edit-row"><input type="number" id="editCardio-'+idx+'" placeholder="Cardio min" value="'+(e.cardioMin||"")+'"></div>';
  html += '<textarea id="editNotes-'+idx+'" placeholder="Notes">'+(e.notes||"")+'</textarea>';
  html += '<button class="save-btn" id="editSave-'+idx+'">Save Changes</button>';
  container.innerHTML = html;

  container.querySelector('#editSave-'+idx).onclick = async ()=>{
    const updated = JSON.parse(JSON.stringify(e));
    container.querySelectorAll('input[data-ex]').forEach(inp=>{
      const exi = parseInt(inp.dataset.ex), si = parseInt(inp.dataset.set), field = inp.dataset.field;
      const v = inp.value !== "" ? Number(inp.value) : null;
      updated.exercises[exi].sets[si][field] = v;
    });
    updated.cardioMin = container.querySelector('#editCardio-'+idx).value || null;
    updated.notes = container.querySelector('#editNotes-'+idx).value || "";
    updated.lastSaved = new Date().toISOString();
    try{
      await window.storage.set(entryWrap.key, JSON.stringify(updated), false);
      renderHistory();
    }catch(err){ alert('Could not save changes — try again.'); }
  };
}

async function exportAllData(){
  try{
    const out = { exportedAt: new Date().toISOString(), workouts: [], nutrition: [] };
    const wList = await window.storage.list("entry:", false);
    if(wList && wList.keys){
      for(const k of wList.keys){
        try{ const r = await window.storage.get(k, false); out.workouts.push(JSON.parse(r.value)); }catch(e){}
      }
    }
    const nList = await window.storage.list("nutrition:", false);
    if(nList && nList.keys){
      for(const k of nList.keys){
        try{ const r = await window.storage.get(k, false); out.nutrition.push(JSON.parse(r.value)); }catch(e){}
      }
    }
    const blob = new Blob([JSON.stringify(out, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "training-log-export-" + todayISO() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    alert("Export failed — try again.");
  }
}

async function saveNutrition(){
  const btn = document.getElementById("nSaveBtn");
  const msg = document.getElementById("nSaveMsg");
  btn.disabled = true;

  const entry = {
    date: document.getElementById("nDate").value || todayISO(),
    weight: document.getElementById("nWeight").value || null,
    calories: document.getElementById("nCal").value || null,
    protein: document.getElementById("nProtein").value || null,
    notes: document.getElementById("nNotes").value || "",
    timestamp: new Date().toISOString()
  };

  try{
    const key = "nutrition:" + entry.date;
    const res = await window.storage.set(key, JSON.stringify(entry), false);
    if(res){
      msg.textContent = "Saved.";
      msg.style.color = "var(--good)";
      loadNutritionLog();
    } else {
      msg.textContent = "Couldn't save — try again.";
      msg.style.color = "var(--danger)";
    }
  } catch(e){
    msg.textContent = "Storage error — your data wasn't saved.";
    msg.style.color = "var(--danger)";
  }
  btn.disabled = false;
}

async function loadNutritionLog(){
  const list_el = document.getElementById("nutriLogList");
  try{
    const list = await window.storage.list("nutrition:", false);
    if(!list || !list.keys || list.keys.length===0){
      list_el.innerHTML = '<div class="empty">No days logged yet.</div>';
      return;
    }
    const keys = [...list.keys].sort().reverse().slice(0,10);
    let html = "";
    for(const k of keys){
      try{
        const r = await window.storage.get(k, false);
        if(r && r.value){
          const e = JSON.parse(r.value);
          html += '<div class="nutri-log-entry"><span class="d">'+e.date+'</span>';
          html += '<span class="v">'+(e.calories||"–")+' cal &middot; '+(e.protein||"–")+'g protein'+(e.weight ? ' &middot; '+e.weight+' lb' : '')+'</span></div>';
        }
      }catch(e){}
    }
    list_el.innerHTML = html || '<div class="empty">No days logged yet.</div>';
  }catch(e){
    list_el.innerHTML = '<div class="empty">Couldn\'t load nutrition log.</div>';
  }
}

// ---------- Progress charts ----------
function allExerciseNames(){
  const names = new Set();
  DAY_ORDER.forEach(k=>{
    (PROGRAM[k].exercises||[]).forEach(ex=>names.add(ex.name));
  });
  return [...names].sort();
}

async function renderProgress(){
  const view = document.getElementById("progressView");
  view.innerHTML = '<div class="loading">Loading...</div>';

  let html = '<select class="chart-select" id="progressSelect">';
  html += '<option value="__bodyweight__">Body Weight</option>';
  allExerciseNames().forEach(n=>{ html += '<option value="'+n.replace(/"/g,"&quot;")+'">'+n+'</option>'; });
  html += '</select>';
  html += '<div id="chartHolder"><div class="loading">Loading chart...</div></div>';
  view.innerHTML = html;

  document.getElementById("progressSelect").onchange = (e)=>drawProgressChart(e.target.value);
  drawProgressChart("__bodyweight__");
}

async function drawProgressChart(selection){
  const holder = document.getElementById("chartHolder");
  holder.innerHTML = '<div class="loading">Loading chart...</div>';
  let points = [];
  let unit = "lb";
  let title = selection;

  try{
    if(selection === "__bodyweight__"){
      title = "Body Weight";
      const list = await window.storage.list("nutrition:", false);
      if(list && list.keys){
        for(const k of list.keys){
          try{
            const r = await window.storage.get(k, false);
            const e = JSON.parse(r.value);
            if(e.weight!=null && e.weight!=="") points.push({ date: e.date, value: Number(e.weight) });
          }catch(err){}
        }
      }
    } else {
      title = selection;
      const list = await window.storage.list("entry:", false);
      if(list && list.keys){
        for(const k of list.keys){
          try{
            const r = await window.storage.get(k, false);
            const e = JSON.parse(r.value);
            const ex = (e.exercises||[]).find(x=>x.name===selection);
            if(ex){
              const weights = (ex.sets||[]).filter(s=>s.weight!=null).map(s=>s.weight);
              if(weights.length) points.push({ date: e.date, value: Math.max(...weights) });
            }
          }catch(err){}
        }
      }
    }
  }catch(e){
    holder.innerHTML = '<div class="chart-empty">Couldn\'t load this chart right now.</div>';
    return;
  }

  points.sort((a,b)=> a.date < b.date ? -1 : 1);

  if(points.length < 2){
    holder.innerHTML = '<div class="chart-card"><div class="chart-title">'+title+'</div>'+
      '<div class="chart-empty">Log at least 2 data points to see a trend.</div></div>';
    return;
  }

  holder.innerHTML = '<div class="chart-card"><div class="chart-title">'+title+'</div>'+
    '<div class="chart-sub">'+points[0].date+' \u2192 '+points[points.length-1].date+' &middot; '+points.length+' points</div>'+
    '<div class="chart-svg-wrap">'+buildLineChartSVG(points, unit)+'</div></div>';
}

function buildLineChartSVG(points, unit){
  const w = 620, h = 220, padL = 40, padR = 16, padT = 16, padB = 28;
  const vals = points.map(p=>p.value);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = (maxV - minV) || 1;
  const yFor = v => padT + (h-padT-padB) * (1 - (v-minV)/range);
  const xFor = i => padL + (w-padL-padR) * (i/(points.length-1));

  let path = "";
  points.forEach((p,i)=>{
    const x = xFor(i), y = yFor(p.value);
    path += (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
  });

  let dots = points.map((p,i)=>{
    const x = xFor(i), y = yFor(p.value);
    return '<circle class="chart-pt" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3"></circle>';
  }).join("");

  const firstLabel = points[0].date.slice(5);
  const lastLabel = points[points.length-1].date.slice(5);

  let svg = '<svg viewBox="0 0 '+w+' '+h+'" width="100%">';
  svg += '<line class="chart-axis" x1="'+padL+'" y1="'+(h-padB)+'" x2="'+(w-padR)+'" y2="'+(h-padB)+'"></line>';
  svg += '<text class="chart-label" x="'+padL+'" y="'+(padT+4)+'">'+Math.round(maxV)+' '+unit+'</text>';
  svg += '<text class="chart-label" x="'+padL+'" y="'+(h-padB-2)+'">'+Math.round(minV)+' '+unit+'</text>';
  svg += '<text class="chart-label" x="'+padL+'" y="'+(h-6)+'">'+firstLabel+'</text>';
  svg += '<text class="chart-label" x="'+(w-padR-30)+'" y="'+(h-6)+'">'+lastLabel+'</text>';
  svg += '<path class="chart-line" d="'+path+'"></path>';
  svg += dots;
  svg += '</svg>';
  return svg;
}

// ---------- Streak strip ----------
async function loadStreak(){
  try{
    const list = await window.storage.list("entry:", false);
    const dates = new Set();
    if(list && list.keys){
      list.keys.forEach(k=>{
        const parts = k.split(":");
        if(parts[1]) dates.add(parts[1]);
      });
    }
    const strip = document.getElementById("streak");
    strip.innerHTML = "";
    const today = new Date();
    let count7 = 0;
    for(let i=6; i>=0; i--){
      const d = new Date(today);
      d.setDate(d.getDate()-i);
      const iso = d.toISOString().slice(0,10);
      const filled = dates.has(iso);
      if(filled) count7++;
      const tick = document.createElement("div");
      tick.className = "tick" + (filled ? " filled":"");
      strip.appendChild(tick);
    }
    document.getElementById("streakText").textContent = count7 + " of last 7 days trained";
    document.getElementById("totalText").textContent = dates.size + " sessions total";
  }catch(e){
    document.getElementById("streakText").textContent = "History unavailable";
  }
}

renderDayGrid();
renderLog();
loadStreak();
